problemDetail.org.springframework.http.converter.HttpMessageNotReadableException=The sent JSON contains syntax errors or invalid data types.
problemDetail.type.org.springframework.http.converter.HttpMessageNotReadableException=https://coagronet.com/errors/malformed-request

