# Título y Detalle general para cuando fallan las validaciones (@Valid)
problemDetail.title.org.springframework.web.bind.MethodArgumentNotValidException=Invalid Data
problemDetail.org.springframework.web.bind.MethodArgumentNotValidException=The submitted information contains one or more validation errors.

# --- Validación: Nombre ---
# Formato: Anotacion.nombreObjeto.nombreCampo
NotBlank.moduloRequest.nombre=The name is required.
Size.moduloRequest.nombre=The name must have between {2} and {1} characters.

# --- Validación: URL ---
NotBlank.moduloRequest.url=The URL is required.
Size.moduloRequest.url=The URL cannot exceed {1} characters.

# --- Validación: Descripción e Icono ---
Size.moduloRequest.descripcion=The description cannot exceed {1} characters.
Size.moduloRequest.icon=The icon cannot exceed {1} characters.

# --- Validación: Relaciones (IDs) ---
# @NotNull
NotNull.moduloRequest.estadoId=State ID is required.
NotNull.moduloRequest.subSistemaId=Subsystem ID is required.
NotNull.moduloRequest.tipoModuloId=Module Type ID is required.
NotNull.moduloRequest.tipoAplicacionId=Application Type ID is required.

# @Positive
Positive.moduloRequest.estadoId=The state ID must be a positive number.
Positive.moduloRequest.subSistemaId=The subsystem ID must be a positive number.
Positive.moduloRequest.tipoModuloId=The module type ID must be a positive number.
Positive.moduloRequest.tipoAplicacionId=The application type ID must be a positive number.

# --- Validación: Roles (Lista) ---
# Aplica a la lista en sí o a sus elementos
NotBlank.moduloRequest.roles=The role cannot be empty.

# --- Validación: NombreId ---
Size.moduloRequest.nombreId=The name ID cannot exceed {1} characters.


# --- Errores de Negocio ---

# {0} = Nombre de la entidad (ej. Estado), {1} = ID
entidad.no_encontrada=There is no {0} with ID: {1}.

# {0} = Nombre del módulo que se intentó crear
modulo.duplicado=There is already a module with the name: {0}.

# {0} = Nombre de la entidad, {1} = ID
recurso.no_encontrado=There is no {0} with ID: {1}.

# Error 403 Forbidden
security.access_denied=You do not have the necessary permissions (Role) to perform this action.

# Error 401 Unauthorized (Sin token o token inválido)
security.unauthorized=You must be logged in to access this resource.

# Personalización para HttpMessageNotReadableException (JSON mal formado)
problemDetail.title.org.springframework.http.converter.HttpMessageNotReadableException=Format Error
problemDetail.org.springframework.http.converter.HttpMessageNotReadableException=The sent JSON contains syntax errors or invalid data types.
problemDetail.type.org.springframework.http.converter.HttpMessageNotReadableException=https://coagronet.com/errors/malformed-request

