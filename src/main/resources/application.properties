# Nombre de la aplicacion
spring.application.name=Coagronet

# Configuracion del servidor
server.address=0.0.0.0
server.port=8080

# Configuracion de la base de datos
spring.datasource.url=jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion JPA e Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.open-in-view=false


# JWT / Seguridad
jwt.secret=${JWT_SECRET}
jwt.default-role=${JWT_DEFAULT_ROLE}

# Configuraciones avanzadas de Spring
spring.main.allow-circular-references=true

# Configuracion del correo
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# URLs personalizadas de la aplicacion
app.verification-url=${URL_VERIFICATION}
app.reset-password-url=${URL_RESET_PASSWORD}

# --- CORS ---
app.cors.allowed-origins=http://localhost:5173,\
http://inmero.co,\
http://www.inmero.co,\
https://inmero.co,\
https://www.inmero.co

# REPORTES
path.logos =/home/usco/Desktop/fileserver/logos
path.logo.empresa =empresa