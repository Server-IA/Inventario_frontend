
myapp.queries.tipo_identificacion=SELECT tii_id as id, tii_nombre as name FROM tipo_identificacion order by tii_nombre
myapp.queries.estado=SELECT est_id as id, est_nombre as name FROM estado order by est_nombre
myapp.queries.pais=SELECT pai_id as id, pai_nombre as name FROM pais WHERE pai_empresa_id = $EMPRESA_ID$ $AND pai_id = PARENT_ID$ order by pai_nombre 
myapp.queries.departamento=SELECT dep_id as id, dep_nombre as name FROM departamento WHERE dep_empresa_id = $EMPRESA_ID$ $AND dep_pais_id = PARENT_ID$ order by dep_nombre
myapp.queries.empresa=SELECT emp_id as id, emp_nombre as name FROM empresa as item WHERE emp_estado = 1 ORDER BY emp_nombre
myapp.queries.sede= SELECT sed_id as id, sed_nombre as name FROM sede as item WHERE sed_estado_id = 1 AND sed_empresa_id = $EMPRESA_ID$ $AND sed_tipo_sede_id = PARENT_ID$ ORDER BY sed_nombre ASC
myapp.queries.bloque= SELECT blo_id as id, blo_nombre as name FROM bloque as item WHERE blo_estado_id = 1 AND blo_empresa_id = $EMPRESA_ID$ $AND blo_tipo_bloque_id = PARENT_ID$ ORDER BY blo_nombre ASC
myapp.queries.espacio= SELECT esp_id as id, esp_nombre as name FROM espacio as item WHERE esp_estado_id = 1 AND esp_empresa_id = $EMPRESA_ID$ $AND esp_tipo_espacio_id = PARENT_ID$ ORDER BY esp_nombre ASC
myapp.queries.almacen=SELECT alm_id as id, alm_nombre as name FROM almacen as item WHERE alm_estado = 1 ORDER BY alm_nombre
myapp.queries.produccion=SELECT pro_id as id, pro_nombre as name FROM produccion as item WHERE pro_estado = 1 ORDER BY pro_nombre
myapp.queries.producto_presentacion=SELECT prp_producto_id AS id, pre_nombre || ' ' || prp_cantidad || ' ' || uni_nombre || ' (' || mar_nombre || ') ' AS name FROM producto_presentacion, unidad, producto, marca, presentacion WHERE prp_unidad_id = uni_id AND prp_producto_id = pro_id AND prp_marca_id = mar_id AND prp_presentacion_id = pre_id ORDER BY prp_id ASC
myapp.queries.tipo_movimiento=SELECT tim_id AS id, tim_nombre AS name FROM tipo_movimiento ORDER BY tim_id ASC
myapp.queries.municipio=SELECT mun_id AS id, mun_nombre AS name FROM municipio WHERE mun_empresa_id = $EMPRESA_ID$ $AND mun_departamento_id = PARENT_ID$ ORDER BY mun_nombre ASC
myapp.queries.producto_categoria=SELECT prc_id as id, prc_nombre as name FROM producto_categoria order by prc_nombre
myapp.queries.producto=SELECT pro_id as id, pro_nombre as name FROM producto WHERE pro_empresa_id = $EMPRESA_ID$ $AND pro_producto_categoria_id = PARENT_ID$ order by pro_nombre
myapp.queries.grupo=SELECT gru_id as id, gru_nombre as name FROM grupo WHERE gru_empresa_id = $EMPRESA_ID$ $AND gru_id = PARENT_ID$ order by gru_nombre ASC
myapp.queries.tipo_sede=SELECT tis_id as id, tis_nombre as name FROM tipo_sede WHERE tis_empresa_id = $EMPRESA_ID$ $AND tis_id = PARENT_ID$ order by tis_nombre ASC
myapp.queries.tipo_bloque=SELECT tib_id as id, tib_nombre as name FROM tipo_bloque WHERE tib_empresa_id = $EMPRESA_ID$ $AND tib_id = PARENT_ID$ order by tib_nombre ASC
myapp.queries.tipo_espacio=SELECT tie_id as id, tie_nombre as name FROM tipo_espacio WHERE tie_empresa_id = $EMPRESA_ID$ $AND tie_id = PARENT_ID$ order by tib_nombre ASC