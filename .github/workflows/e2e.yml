name: E2E Tests

on:
  pull_request:
    branches: [develop, test]
  push:
    branches: [feature/qa-tests]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start frontend
        run: |
          docker compose -f docker-compose.e2e.yml up --build -d
          # Wait for frontend to be ready
          for i in $(seq 1 30); do
            curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/coagronet/ | grep -q 200 && break
            sleep 2
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        env:
          VITE_BACKEND_URI: "https://dev.api.inmero.co/coagronet"
          E2E_BASE_URL: "http://localhost:3000/coagronet"
          E2E_WEB_SERVER_URL: "http://localhost:3000"
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_COMPANY_CONTEXT_NAME: ${{ secrets.E2E_COMPANY_CONTEXT_NAME }}
          E2E_COMPANY_CONTEXT_ROLE_NAME: ${{ secrets.E2E_COMPANY_CONTEXT_ROLE_NAME }}
        run: npx playwright test --reporter=line --timeout=45000

      - name: Stop frontend
        if: always()
        run: docker compose -f docker-compose.e2e.yml down
